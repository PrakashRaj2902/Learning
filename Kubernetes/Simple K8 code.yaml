# This file deploys an NGINX web server in Kubernetes

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2  # Create 2 pods (for high availability)
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx  # Label to match with selector
    spec:
      containers:
      - name: nginx
        image: nginx:latest  # Pull the latest NGINX image
        ports:
        - containerPort: 80  # Container listens on port 80

---

# This exposes the above deployment to the internet

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort  # Exposes it via a port on the node
  selector:
    app: nginx  # Targets pods with label "app: nginx"
  ports:
  - port: 80         # Service port
    targetPort: 80   # Container port
    nodePort: 30080  # External port exposed on the node
